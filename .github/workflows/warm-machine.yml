name: Warm Machine (Friday Shows)

on:
  workflow_dispatch:
  schedule:
    # 11 PM Friday–2 AM UTC Saturday (7–10 PM EDT): every 5 min — peak signup period
    - cron: '*/5 23 * * 5'
    - cron: '*/5 0-1 * * 6'
    # 2–4 AM UTC Saturday (10 PM–midnight EDT): every 10 min — winding down
    - cron: '*/10 2-3 * * 6'

permissions:
  contents: read

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: curl --fail https://te-live.fly.dev/health