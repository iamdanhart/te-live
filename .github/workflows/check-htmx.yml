name: Check htmx version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check htmx version
        run: |
          STATUS=$(dev_tools/check-htmx.sh)
          echo "$STATUS"
          if [ "$(echo "$STATUS" | jq -r '.up_to_date')" != "true" ]; then
            echo "::warning::htmx is out of date — run dev_tools/vendor-htmx.sh to update"
            exit 1
          fi