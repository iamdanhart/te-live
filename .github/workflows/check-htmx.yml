name: Check htmx version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check htmx version
        run: |
          STATUS=$(dev_tools/check-htmx.sh)
          echo "$STATUS"
          if [ "$(echo "$STATUS" | jq -r '.up_to_date')" != "true" ]; then
            echo "::warning::htmx is out of date — run dev_tools/vendor-htmx.sh to update"
            exit 1
          fi