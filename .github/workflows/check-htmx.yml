name: Check htmx version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check htmx version
        run: |
          STATUS=$(dev_tools/check-htmx.sh)
          echo "$STATUS"
          if [ "$(echo "$STATUS" | jq -r '.up_to_date')" != "true" ]; then
            echo "::warning::htmx is out of date — run dev_tools/vendor-htmx.sh to update"
            exit 1
          fi